<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0f">
  <meta name="description" content="Koa — a friendly AI with six moods.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Koa AI">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <title>Koa — AI with a mood</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">K</div>
        <div><strong>Koa</strong><span>AI with a mood</span></div>
      </div>

      <div class="mood-card">
        <div class="mood-top"><span>Current mood</span><span id="intensity">65%</span></div>
        <div class="big-emoji" id="moodEmoji">😊</div>
        <h2 id="moodName">Happy</h2>
        <p id="moodDescription">Warm, upbeat and ready to help.</p>
        <div class="meter"><div id="meterFill"></div></div>
      </div>

      <div class="emotion-list" id="emotionList"></div>

      <div class="sidebar-note">
        <span>🌿</span>
        Koa's mood changes gradually with the conversation.
      </div>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <div>
          <div class="status"><span class="dot"></span> Online</div>
          <h1>Koa</h1>
          <p>Ask me anything.</p>
        </div>
        <div class="header-actions"><button id="installBtn" class="ghost install" hidden>Install Koa</button><button id="clearBtn" class="ghost">New chat</button></div>
      </header>

      <section id="messages" class="messages">
        <div class="welcome">
          <div class="welcome-emoji">🌿</div>
          <h2>Hey, I'm Koa.</h2>
          <p>A curious little AI with six moods. What's on your mind?</p>
        </div>
      </section>

      <form id="chatForm" class="composer">
        <textarea id="input" rows="1" placeholder="Message Koa..." autocomplete="off"></textarea>
        <button id="sendBtn" type="submit" aria-label="Send">↑</button>
      </form>
      <p class="hint">Enter to send · Shift+Enter for a new line</p>
    </main>
  </div>
  <script src="/app.js"></script>
  <script src="/pwa.js"></script>
</body>
</html>
